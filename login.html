<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入 - AI Assistant</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-body">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-mark large">AI</div>
        <h1>AI Assistant</h1>
        <p>請登入以繼續使用</p>
      </div>

      <form id="login-form" class="login-form">
        <label>
          <span>帳號</span>
          <input id="username" type="text" placeholder="請輸入帳號" required />
        </label>

        <label>
          <span>密碼</span>
          <input id="password" type="password" placeholder="請輸入密碼" required />
        </label>

        <button type="submit" class="primary-btn full-width">登入</button>
      </form>

      <p id="login-message" class="login-message" aria-live="polite"></p>
    </div>

    <script src="login.js"></script>
  </body>
</html>
